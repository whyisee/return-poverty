services:
  mysql:
    image: mysql:8.4
    container_name: return-poverty-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: return_poverty
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:

